name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: EpiAware/.github/.github/workflows/coverage.yml@4ade02869137af2a1799c704df8a0256ef5b5de6
    with:
      julia_version: '1'
    secrets: inherit  # pragma: allowlist secret
