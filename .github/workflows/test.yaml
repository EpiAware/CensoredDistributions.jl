name: Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: EpiAware/.github/.github/workflows/tests.yml@c8f00e8d2e64d3f7e7afc64666041cf8595ff7ae
    secrets: inherit  # pragma: allowlist secret

  downgrade-compat:
    uses: EpiAware/.github/.github/workflows/downgrade.yml@c8f00e8d2e64d3f7e7afc64666041cf8595ff7ae
    secrets: inherit  # pragma: allowlist secret
