name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: EpiAware/.github/.github/workflows/coverage.yml@c8f00e8d2e64d3f7e7afc64666041cf8595ff7ae
    with:
      julia_version: '1'
    secrets: inherit  # pragma: allowlist secret
